<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager - Asset Performance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Search</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="summary.html">Performance Summary</a>
    </nav>
    <main>
        <h1 id="pageTitle">Asset Performance</h1>

        <div class="card">
            <h3>Value Over Time</h3>
            <canvas id="perfChart" width="800" height="300"></canvas>
            <p id="chartError" class="error"></p>
        </div>

        <div class="card">
            <h3>Individual Acquisitions</h3>
            <table id="holdingsTable" style="display:none;">
                <thead>
                <tr><th>Qty</th><th>Price Paid</th><th>Current Price</th><th>Current Value</th><th>Date Acquired</th><th>P/L</th><th></th></tr>
                </thead>
                <tbody id="holdingsBody"></tbody>
            </table>
            <p id="loadError" class="error"></p>
        </div>
    </main>
    <script src="js/vendor/chart.umd.js"></script>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/performance.js"></script>
</body>
</html>
