<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Manager - Asset Detail</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Search</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="summary.html">Performance Summary</a>
    </nav>
    <main>
        <h1 id="assetTitle">Asset</h1>
        <p id="currentPrice"></p>


        <div class="card">
            <h3>Historical Price</h3>
            <div>
                <button onclick="loadHistory('1w')">1W</button>
                <button onclick="loadHistory('1m')">1M</button>
                <button onclick="loadHistory('6m')">6M</button>
                <button onclick="loadHistory('1y')">1Y</button>
                <button onclick="loadHistory('5y')">5Y</button>
            </div>
            <canvas id="priceChart" width="800" height="300"></canvas>
            <p id="historyError" class="error"></p>
        </div>

        <div class="card">
            <h3>Record Investment</h3>
            <label>Quantity: <input type="number" id="quantity" step="any" min="0"></label><br>
            <label>Acquisition date: <input type="date" id="dateAcquired"></label><br>
            <button onclick="recordInvestment()">Record Investment</button>
            <p id="recordError" class="error"></p>
            <p id="recordSuccess" style="color:#0a7a2e;"></p>
        </div>
    </main>
    <script src="js/vendor/chart.umd.js"></script>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/asset.js"></script>
</body>
</html>
